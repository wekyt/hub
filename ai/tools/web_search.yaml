name: web_search
title: Web search
version: 0.2.0
kind: search
toolset: read
description: >-
  Search the public web for documentation, API references, and known
  vulnerabilities. It is read only and never used to fetch secrets or
  private data. In v0.2.0 this tool is defined but not implemented: the CLI
  ships no search provider, so calls return NOT_IMPLEMENTED instead of a
  faked result. A provider is added in a later version.
mcp:
  inputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      query:
        type: string
        minLength: 1
        description: Search query in plain words.
      maxResults:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
    required:
      - query
    additionalProperties: false
  outputSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    properties:
      query:
        type: string
      results:
        type: array
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            snippet:
              type: string
          required:
            - title
            - url
    required:
      - query
      - results
    additionalProperties: false
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
outputs: >-
  In v0.2.0, no results: every call returns the NOT_IMPLEMENTED error,
  because no search provider is configured. When a provider is added, the
  output is an object with the query and a list of results (title, URL,
  snippet), with no page content fetched and no secrets requested.
implementation:
  implemented: false
  kind: api
  provider: none
  note: >-
    No search provider is bundled in v0.2.0. The interface is fixed here
    so a provider can be added without changing the agents. Until then,
    the handler returns NOT_IMPLEMENTED and runs no request.
  authentication: none
  timeoutSeconds: 30
effects:
  writes: []
  deletes: []
  externalCalls: []
  reversible: true
  idempotent: true
permissions:
  orchestrator:
    decision: allow
  architect:
    decision: allow
  dev:
    decision: deny
  qa:
    decision: deny
  security:
    decision: allow
  judge:
    decision: deny
    scope: The judge is a decision step, not a tool user.
errors:
  - code: NOT_IMPLEMENTED
    when: The tool is called in v0.2.0, which ships no search provider.
    retryable: false
    message: Web search has no provider in v0.2.0. Use the harness search capability, or wait for a provider to be added.
examples:
  - description: The architect looks up the current Ink release notes.
    input:
      query: Ink 8 release notes React 19
      maxResults: 5
    error:
      code: NOT_IMPLEMENTED
      message: Web search has no provider in v0.2.0.
