name: Publish to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Build
        working-directory: cli
        run: npm run build
      - name: Test
        working-directory: cli
        run: npm test
      - name: Publish
        working-directory: cli
        run: npm publish --access public --provenance
